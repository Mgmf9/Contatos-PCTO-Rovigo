<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Contatos PCTO Rovigo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='56' text-anchor='middle'>📞</text></svg>">
<style>
  :root {
    --bg: #f4f5fb;
    --bg-glow: #e4e6ff;
    --surface: #ffffff;
    --surface-2: #f6f7fc;
    --border: #e6e8f2;
    --text: #181b2e;
    --muted: #6a6f88;
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --accent-soft: #ecebff;
    --shadow: 0 1px 2px rgba(24,27,46,.04), 0 6px 20px rgba(24,27,46,.06);
    --shadow-hover: 0 2px 4px rgba(24,27,46,.05), 0 12px 28px rgba(24,27,46,.10);
    --radius: 18px;

    --c-ligar: #f59e0b; --c-ligar-bg: #fff3dc; --c-ligar-fg: #9a5800;
    --c-auto:  #d4a900; --c-auto-bg:  #fdf6cc; --c-auto-fg:  #736000;
    --c-enc:   #3b82f6; --c-enc-bg:   #e0ebff; --c-enc-fg:   #1d4ba6;
    --c-ok:    #16a34a; --c-ok-bg:    #daf5e2; --c-ok-fg:    #12663a;
    --c-nao:   #ef4444; --c-nao-bg:   #ffe3e6; --c-nao-fg:   #a1182d;
    --c-sem:   #9aa0b8; --c-sem-bg:   #eceef6; --c-sem-fg:   #5b6078;
  }
  [data-tema="escuro"] {
    --bg: #0e0f1a;
    --bg-glow: #1d1f3d;
    --surface: #181a2b;
    --surface-2: #1f2236;
    --border: #2a2d46;
    --text: #eceef8;
    --muted: #9a9fba;
    --accent: #7c7bff;
    --accent-2: #a78bfa;
    --accent-soft: #26284a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.5);

    --c-ligar-bg: #4a3210; --c-ligar-fg: #ffc46b;
    --c-auto-bg:  #433d0e; --c-auto-fg:  #f5dc5a;
    --c-enc-bg:   #1b3260; --c-enc-fg:   #9cc0ff;
    --c-ok-bg:    #143b24; --c-ok-fg:    #7fe0a0;
    --c-nao-bg:   #4a1820; --c-nao-fg:   #ff9aaa;
    --c-sem-bg:   #262941; --c-sem-fg:   #b0b5cf;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: light; }
  html[data-tema="escuro"] { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(900px 380px at 85% -80px, var(--bg-glow), transparent 70%),
      radial-gradient(700px 320px at -10% -60px, var(--bg-glow), transparent 70%),
      var(--bg);
    background-repeat: no-repeat;
    transition: background-color .25s, color .25s;
  }
  .wrap { max-width: 760px; margin: auto; padding: 24px 16px 80px; }

  /* Cabeçalho */
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 30px; line-height: 1.1; margin: 6px 0 6px; letter-spacing: -.8px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .icon-btn { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; border-radius: 14px; flex-shrink: 0; }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Prazo */
  .prazo {
    margin-top: 18px; padding: 14px 16px; border-radius: var(--radius); color: #fff;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 28px rgba(79,70,229,.30);
    display: flex; align-items: center; gap: 14px;
  }
  .prazo .dias { font-size: 30px; font-weight: 800; line-height: 1; min-width: 48px; text-align: center; letter-spacing: -1px; }
  .prazo .dias small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .85; margin-top: 3px; }
  .prazo .txt { font-size: 14px; line-height: 1.45; }
  .prazo .txt b { font-weight: 700; }
  [data-tema="escuro"] .prazo { background: linear-gradient(120deg, #4338ca, #6d28d9); }
  [data-tema="escuro"] .prazo.ok { background: linear-gradient(120deg, #15803d, #0f766e); }
  [data-tema="escuro"] .prazo.urgente { background: linear-gradient(120deg, #be123c, #c2410c); }
  .prazo.urgente { background: linear-gradient(120deg, #e11d48, #f97316); box-shadow: 0 10px 28px rgba(225,29,72,.30); }
  .prazo.ok { background: linear-gradient(120deg, #16a34a, #0d9488); box-shadow: 0 10px 28px rgba(22,163,74,.28); }

  /* Estatísticas */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 12px; box-shadow: var(--shadow); }
  .stat .ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 10px; }
  .stat .ico svg { width: 16px; height: 16px; }
  .stat b { display: block; font-size: 26px; line-height: 1; letter-spacing: -.8px; font-weight: 800; }
  .stat span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .i-total { background: var(--accent-soft); color: var(--accent); }
  .i-lig { background: var(--c-ok-bg); color: var(--c-ok-fg); }
  .i-rel { background: var(--c-ligar-bg); color: var(--c-ligar-fg); }

  .progresso { margin-bottom: 20px; }
  .progresso .rot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .trilho { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .trilho i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }

  /* Botões */
  button { font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: transform .12s, background .15s, box-shadow .15s, border-color .15s; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  button:hover { background: var(--surface-2); border-color: var(--muted); }
  button:active { transform: scale(.97); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button svg { width: 16px; height: 16px; flex-shrink: 0; }
  button.prim { background: linear-gradient(120deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(79,70,229,.32); }
  button.prim:hover { filter: brightness(1.07); box-shadow: 0 8px 22px rgba(79,70,229,.4); }
  button.perigo { color: var(--c-nao); }
  button.perigo:hover { background: var(--c-nao-bg); border-color: transparent; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .barra .espaco { flex: 1; }
  .barra button.suave { font-weight: 500; color: var(--muted); }

  /* Busca e filtros */
  .busca { position: relative; margin-bottom: 12px; }
  .busca svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .busca input { width: 100%; padding-left: 42px; height: 46px; border-radius: 14px; }
  .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 14px; margin: 0 -2px; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .filtro { padding: 7px 13px; font-size: 13px; font-weight: 600; border-radius: 999px; white-space: nowrap; color: var(--muted); }
  .filtro em { font-style: normal; font-size: 11px; background: var(--surface-2); color: var(--muted); padding: 1px 7px; border-radius: 99px; margin-left: 2px; }
  .filtro.ativo { background: var(--text); color: var(--bg); border-color: var(--text); }
  .filtro.ativo:hover { background: var(--text); }
  .filtro.ativo em { background: rgba(255,255,255,.18); color: inherit; }
  [data-tema="escuro"] .filtro.ativo em { background: rgba(0,0,0,.14); }

  /* Cartões */
  .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 14px 20px; margin-bottom: 12px; box-shadow: var(--shadow); transition: box-shadow .2s, transform .2s; overflow: hidden; animation: entra .35s both; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--cor, var(--c-sem)); }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .c-ligar { --cor: var(--c-ligar); } .c-auto { --cor: var(--c-auto); } .c-enc { --cor: var(--c-enc); }
  .c-ok { --cor: var(--c-ok); } .c-nao { --cor: var(--c-nao); } .c-sem { --cor: var(--c-sem); }

  .top { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 17px; flex-shrink: 0; background: var(--cor-bg, var(--c-sem-bg)); color: var(--cor-fg, var(--c-sem-fg)); }
  .c-ligar .avatar, .c-ligar .badge { --cor-bg: var(--c-ligar-bg); --cor-fg: var(--c-ligar-fg); }
  .c-auto .avatar, .c-auto .badge { --cor-bg: var(--c-auto-bg); --cor-fg: var(--c-auto-fg); }
  .c-enc .avatar, .c-enc .badge { --cor-bg: var(--c-enc-bg); --cor-fg: var(--c-enc-fg); }
  .c-ok .avatar, .c-ok .badge { --cor-bg: var(--c-ok-bg); --cor-fg: var(--c-ok-fg); }
  .c-nao .avatar, .c-nao .badge { --cor-bg: var(--c-nao-bg); --cor-fg: var(--c-nao-fg); }
  .titulo { flex: 1; min-width: 0; }
  .nome { font-weight: 700; font-size: 16px; line-height: 1.3; letter-spacing: -.2px; }
  .badge { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--cor-bg, var(--c-sem-bg)); color: var(--cor-fg, var(--c-sem-fg)); }
  .num { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2); padding: 3px 8px; border-radius: 8px; flex-shrink: 0; }

  .info { margin-top: 12px; display: grid; gap: 6px; font-size: 14px; }
  .linha-info { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .linha-info svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  .linha-info a { color: var(--text); text-decoration: none; font-weight: 500; overflow-wrap: anywhere; }
  .linha-info a:hover { color: var(--accent); text-decoration: underline; }
  .ligou { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); width: fit-content; }
  .ligou svg { width: 14px; height: 14px; }
  .ligou.sim { background: var(--c-ok-bg); color: var(--c-ok-fg); }
  .obs { margin-top: 12px; font-size: 13px; line-height: 1.5; color: var(--muted); padding: 10px 12px; background: var(--surface-2); border-radius: 12px; white-space: pre-wrap; }

  .acoes { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acoes .grande { flex: 1 1 120px; padding: 11px 14px; }
  .acoes .grande.lig { background: var(--c-ok-bg); color: var(--c-ok-fg); border-color: transparent; }
  .acoes .grande.lig:hover { filter: brightness(.96); }
  .acoes .peq { padding: 9px 11px; font-weight: 500; color: var(--muted); }
  a.btn { text-decoration: none; }
  .acoes a.grande { text-decoration: none; font: inherit; font-size: 14px; font-weight: 600; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; transition: transform .12s, filter .15s; }
  .acoes a.grande:active { transform: scale(.97); }
  .acoes a.grande svg { width: 16px; height: 16px; }
  .acoes a.grande.lig { background: var(--c-ok-bg); color: var(--c-ok-fg); border-color: transparent; }
  .acoes a.grande.lig:hover { filter: brightness(.95); }
  .acoes a.grande:not(.lig):hover { background: var(--surface-2); }

  .vazio { text-align: center; color: var(--muted); padding: 40px 16px; border: 2px dashed var(--border); border-radius: var(--radius); font-size: 14px; }

  /* Formulário (modal) */
  dialog { border: none; padding: 0; background: transparent; color: var(--text); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: visible; }
  dialog::backdrop { background: rgba(10,11,25,.55); backdrop-filter: blur(4px); }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.4); max-height: calc(100vh - 24px); overflow-y: auto; animation: entra .25s both; }
  .modal h2 { margin: 0 0 16px; font-size: 20px; letter-spacing: -.4px; }
  form { display: grid; gap: 14px; }
  form label { font-size: 12px; color: var(--muted); display: grid; gap: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  input, select, textarea { font: inherit; font-size: 15px; font-weight: 500; text-transform: none; letter-spacing: 0; padding: 11px 13px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); color: var(--text); width: 100%; transition: border-color .15s, background .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
  textarea { min-height: 84px; resize: vertical; }
  .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rodape { display: flex; gap: 10px; margin-top: 4px; }
  .rodape button { flex: 1; padding: 12px; }

  @media (max-width: 480px) {
    h1 { font-size: 25px; }
    .linha { grid-template-columns: 1fr; }
    .stat b { font-size: 22px; }
    .num { display: none; }
    .barra #novo { flex: 1 1 100%; padding: 13px; }
    .barra .espaco { display: none; }
    .barra .suave { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">PCTO · Alternanza scuola-lavoro</div>
      <h1>Contatos em Rovigo</h1>
      <div class="sub">Lugares para o estágio de verão. Toque no telefone para ligar.</div>
    </div>
    <button id="tema" class="icon-btn" title="Trocar tema" aria-label="Trocar tema"></button>
  </header>

  <div class="prazo" id="prazo" hidden>
    <div class="dias" id="prazo-dias"></div>
    <div class="txt" id="prazo-txt"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="ico i-total"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><b id="s-total">0</b><span>contatos</span></div>
    <div class="stat"><div class="ico i-lig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><b id="s-lig">0</b><span>já liguei</span></div>
    <div class="stat"><div class="ico i-rel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div><b id="s-rel">0</b><span>ligar de novo</span></div>
  </div>

  <div class="progresso">
    <div class="rot"><span>Progresso das ligações</span><span id="pct">0%</span></div>
    <div class="trilho"><i id="barra-prog"></i></div>
  </div>

  <div class="barra">
    <button class="prim" id="novo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Adicionar contato</button>
    <span class="espaco"></span>
    <button class="suave" id="exportar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Backup</button>
    <button class="suave" id="importarBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Restaurar</button>
    <input type="file" id="importar" accept=".json" hidden>
  </div>

  <div class="busca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="busca" type="search" placeholder="Buscar por nome, telefone, e-mail…" autocomplete="off">
  </div>
  <div class="filtros" id="filtros"></div>

  <div id="lista"></div>
</div>

<dialog id="modal"><div class="modal" id="modal-corpo"></div></dialog>

  ["C.S.T.A. (Salara)","+39 0425 705403","Sim","","Sem resposta",""],
  ["Bianalisi – Centro Medico Rovigo","+39 0425 098300","Sim","","Sem resposta",""],
  ["Farmastudio – Fast S.r.l.","+39 0425 411667","Sim","","Sem resposta",""],
  ["PoPlab S.r.l.","+39 049 806 1111","Sim","","Sem resposta",""]
].map(([nome, tel, ligou, email, resposta, obs]) => ({ nome, tel, ligou, email, resposta, obs }));

const CHAVE = "pcto-contatos";
let contatos;
try { contatos = JSON.parse(localStorage.getItem(CHAVE)); } catch (e) {}
if (!Array.isArray(contatos)) contatos = INICIAIS;
let filtro = null, termo = "";

const $ = id => document.getElementById(id);
const ICO = {
  tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-10 6L2 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  circle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  sol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  lua: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
};

function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(contatos)); } catch (e) {}
}
function esc(t) {
  return String(t || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function classeCor(resp) {
  const b = RESPOSTAS[resp];
  return b ? b.replace("b-", "c-") : "c-sem";
}
function inicial(nome) {
  const m = String(nome || "?").trim().match(/[A-Za-zÀ-ú0-9]/);
  return m ? m[0].toUpperCase() : "?";
}

function atualizarPrazo() {
  const el = $("prazo");
  const dias = Math.ceil((PRAZO - new Date()) / 86400000);
  const vaga = contatos.some(c => c.resposta === "Vaga confirmada");
  el.hidden = false;
  el.className = "prazo";
  if (vaga) {
    el.classList.add("ok");
    $("prazo-dias").innerHTML = '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    $("prazo-txt").innerHTML = "<b>Vaga confirmada!</b><br>Avise a prof.ssa Paola Fusco até sábado, 28/11.";
    return;
  }
  if (dias < 0) {
    el.classList.add("urgente");
    $("prazo-dias").innerHTML = "!<small>prazo</small>";
    $("prazo-txt").innerHTML = "<b>O prazo de 28/11 já passou.</b><br>Fale com a prof.ssa Paola Fusco.";
    return;
  }
  if (dias <= 2) el.classList.add("urgente");
  $("prazo-dias").innerHTML = (dias === 0 ? "Hoje" : dias) + (dias === 0 ? "" : "<small>" + (dias === 1 ? "dia" : "dias") + "</small>");
  $("prazo-txt").innerHTML = "<b>Prazo: sábado, 28/11</b><br>Informar a escola sobre a vaga (prof.ssa Paola Fusco).";
}

function desenharFiltros() {
  $("filtros").innerHTML = FILTROS.map(([rot, val]) => {
    const n = val === null ? contatos.length : contatos.filter(c => c.resposta === val).length;
    return `<button class="filtro ${filtro === val ? "ativo" : ""}" data-f="${esc(val === null ? "" : val)}">${rot} <em>${n}</em></button>`;
  }).join("");
  $("filtros").querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
    filtro = b.dataset.f === "" ? null : b.dataset.f;
    desenhar();
  });
}

function desenhar() {
  const lista = $("lista");
  const t = termo.trim().toLowerCase();
  const itens = contatos
    .map((c, i) => ({ c, i }))
    .filter(({ c }) => (filtro === null || c.resposta === filtro) &&
      (!t || [c.nome, c.tel, c.email, c.obs, c.resposta].join(" ").toLowerCase().includes(t)));

  lista.innerHTML = itens.length ? "" : '<div class="vazio">Nenhum contato encontrado.</div>';
  itens.forEach(({ c, i }, k) => {
    const card = document.createElement("div");
    card.className = "card " + classeCor(c.resposta);
    card.style.animationDelay = Math.min(k, 8) * 30 + "ms";
    const telLimpo = (c.tel || "").replace(/[^\d+]/g, "");
    card.innerHTML = `
      <div class="top">
        <div class="avatar">${esc(inicial(c.nome))}</div>
        <div class="titulo">
          <div class="nome">${esc(c.nome)}</div>
          <span class="badge">${esc(c.resposta)}</span>
        </div>
        <span class="num">#${i + 1}</span>
      </div>
      <div class="info">
        ${c.tel ? `<div class="linha-info">${ICO.tel}<a href="tel:${esc(telLimpo)}">${esc(c.tel)}</a></div>` : ""}
        ${c.email ? `<div class="linha-info">${ICO.mail}<a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>` : ""}
        <span class="ligou ${c.ligou === "Sim" ? "sim" : ""}">${c.ligou === "Sim" ? ICO.check + "Já liguei" : ICO.circle + "Ainda não liguei"}</span>
      </div>
      ${c.obs ? `<div class="obs">${esc(c.obs)}</div>` : ""}
      <div class="acoes">
        ${c.tel ? `<a class="grande lig" href="tel:${esc(telLimpo)}">${ICO.tel}Ligar</a>` : ""}
        ${c.email ? `<a class="grande" href="mailto:${esc(c.email)}">${ICO.mail}E-mail</a>` : ""}
        <button class="peq" data-ed="${i}" aria-label="Editar">${ICO.edit}</button>
        <button class="peq perigo" data-del="${i}" aria-label="Apagar">${ICO.trash}</button>
      </div>`;
    lista.appendChild(card);
  });

  const total = contatos.length, lig = contatos.filter(c => c.ligou === "Sim").length;
  $("s-total").textContent = total;
  $("s-lig").textContent = lig;
  $("s-rel").textContent = contatos.filter(c => c.resposta === "Não atendeu – ligar de novo").length;
  const pct = total ? Math.round(lig / total * 100) : 0;
  $("pct").textContent = lig + " de " + total + " · " + pct + "%";
  $("barra-prog").style.width = pct + "%";

  lista.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => abrirForm(+b.dataset.ed));
  lista.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if (confirm("Apagar " + contatos[+b.dataset.del].nome + "?")) {
      contatos.splice(+b.dataset.del, 1); salvar(); desenhar();
    }
  });
  desenharFiltros();
  atualizarPrazo();
}

function abrirForm(i) {
  const novo = i === null;
  const c = novo ? { nome: "", tel: "", ligou: "Não", email: "", resposta: "Sem resposta", obs: "" } : contatos[i];
  $("modal-corpo").innerHTML = `
    <h2>${novo ? "Novo contato" : "Editar contato"}</h2>
    <form id="f">
      <label>Nome do lugar<input name="nome" required value="${esc(c.nome)}" placeholder="Ex.: Laboratório Analisi"></label>
      <label>Telefone<input name="tel" type="tel" value="${esc(c.tel)}" placeholder="+39 0425 ..."></label>
      <label>E-mail<input name="email" type="email" value="${esc(c.email)}" placeholder="contato@exemplo.it"></label>
      <div class="linha">
        <label>Já liguei?<select name="ligou">
          <option ${c.ligou === "Sim" ? "selected" : ""}>Sim</option>
          <option ${c.ligou !== "Sim" ? "selected" : ""}>Não</option></select></label>
        <label>Resposta<select name="resposta">
          ${Object.keys(RESPOSTAS).map(r => `<option ${r === c.resposta ? "selected" : ""}>${r}</option>`).join("")}
        </select></label>
      </div>
      <label>Observação<textarea name="obs" placeholder="Com quem falar, horário, o que disseram…">${esc(c.obs)}</textarea></label>
      <div class="rodape">
        <button type="button" id="cancelar">Cancelar</button>
        <button class="prim" type="submit">Salvar</button>
      </div>
    </form>`;
  const dlg = $("modal");
  dlg.showModal();
  $("cancelar").onclick = () => dlg.close();
  $("f").onsubmit = e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    if (novo) contatos.push(d); else contatos[i] = d;
    salvar(); dlg.close(); desenhar();
  };
}
$("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").close(); });

$("novo").onclick = () => abrirForm(null);
$("busca").oninput = e => { termo = e.target.value; desenhar(); };

$("exportar").onclick = () => {
  const blob = new Blob([JSON.stringify(contatos, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "contatos-pcto.json";
  a.click();
};
$("importarBtn").onclick = () => $("importar").click();
$("importar").onchange = e => {
  const arq = e.target.files[0];
  if (!arq) return;
  arq.text().then(t => {
    try {
      const dados = JSON.parse(t);
      if (Array.isArray(dados)) { contatos = dados; salvar(); desenhar(); }
    } catch (err) { alert("Arquivo inválido"); }
  });
};

function aplicarTema(t) {
  document.documentElement.setAttribute("data-tema", t);
  $("tema").innerHTML = t === "escuro" ? ICO.sol : ICO.lua;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = t === "escuro" ? "#0e0f1a" : "#4f46e5";
}
let tema;
try { tema = localStorage.getItem("pcto-tema"); } catch (e) {}
if (!tema) tema = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
aplicarTema(tema);
$("tema").onclick = () => {
  tema = tema === "escuro" ? "claro" : "escuro";
  aplicarTema(tema);
  try { localStorage.setItem("pcto-tema", tema); } catch (e) {}
};

desenhar();
</script>
</body>
</html>
